services:
  autoware-core:
    image: ghcr.io/autowarefoundation/autoware:core-humble
    container_name: deteccion-seguimiento-carril-autoware-core
    network_mode: host
    ipc: host
    privileged: true
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
    volumes:
      - ./:/workspace/deteccion-seguimiento-carril
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /workspace/deteccion-seguimiento-carril
    stdin_open: true
    tty: true
    command: bash