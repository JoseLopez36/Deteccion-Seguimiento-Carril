[project]
name = "control-vehiculos-lane-following"
version = "0.1.0"
description = "Simulación ROS2/Gazebo para detección y seguimiento de carril en la asignatura Control en Vehículos del máster MIERA."
authors = ["Agustín Mayor", "Rafael Muñoz", "José Francisco López"]
channels = ["robostack-humble", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.10,<3.11"
colcon-common-extensions = "*"
ros-humble-desktop = "*"
ros-humble-xacro = "*"
ros-humble-robot-state-publisher = "*"
ros-humble-joint-state-publisher = "*"
ros-humble-gazebo-ros-pkgs = "*"
opencv = "*"
numpy = "*"

[tasks]
build = "colcon build --symlink-install"
clean = "rm -rf build install log"
sim = "bash -lc 'source install/setup.bash && ros2 launch lane_following_sim simulation.launch.py'"